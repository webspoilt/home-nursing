<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a9d9f"/>
      <stop offset="1" stop-color="#1b5e8c"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e63950"/>
      <stop offset="1" stop-color="#c0246b"/>
    </linearGradient>
  </defs>

  <!-- roof -->
  <path d="M8 32 L32 12 L56 32" fill="none" stroke="url(#teal)"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- caring hands (cup) -->
  <path d="M12 36 C 10 46, 18 54, 32 54 C 46 54, 54 46, 52 36
           C 50 44, 42 48, 32 48 C 22 48, 14 44, 12 36 Z"
        fill="url(#teal)"/>

  <!-- heart -->
  <path d="M32 42 C 26 36, 20 32, 20 26.5 C 20 22.5, 23 20, 26.2 20
           C 28.6 20, 30.8 21.4, 32 23.6 C 33.2 21.4, 35.4 20, 37.8 20
           C 41 20, 44 22.5, 44 26.5 C 44 32, 38 36, 32 42 Z"
        fill="url(#heart)"/>

  <!-- medical cross inside heart -->
  <rect x="30.4" y="24" width="3.2" height="9" rx="1" fill="#fff"/>
  <rect x="27.5" y="26.9" width="9" height="3.2" rx="1" fill="#fff"/>
</svg>